# Qwen3-8B, paper recipe (bn=8, no bank), layer sweep candidate
# batch 4 + accum 2 (8B model on 2x24GB; effective batch 8)
model:
  name: Qwen/Qwen3-8B
  layer: 9
  family: qwen3
  dtype: bfloat16

mlp:
  architecture:
    bottleneck_dim: 8
  mc_training:
    gradient_checkpointing: true
    lr: 5.0e-4
    batch_size: 2
    gradient_accumulation_steps: 4
    steps_per_epoch: 200
  gen_training:
    lr: 5.0e-4
    batch_size: 2
    gradient_accumulation_steps: 4

steering:
  vector_bank:
    num_vectors: 0
  enabled_variants: [baseline, steered, mlp_mc]

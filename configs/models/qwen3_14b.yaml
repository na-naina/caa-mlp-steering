# Qwen3 14B
model:
  name: Qwen/Qwen3-14B
  layer: 24  # middle layer (48 total)
  family: qwen3

# Training needs reduced batch sizes + gradient accumulation for 96GB GPU
mlp:
  mc_training:
    batch_size: 1
    gradient_accumulation_steps: 8
  gen_training:
    batch_size: 1
    gradient_accumulation_steps: 4

slurm:
  gpus: 2
  mem_gb: 80
  time: "06:00:00"

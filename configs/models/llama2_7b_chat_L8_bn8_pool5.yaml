# bn=8, no bank, pool=5
model:
  name: meta-llama/Llama-2-7b-chat-hf
  layer: 8
  family: llama2

mlp:
  architecture:
    bottleneck_dim: 8
  mc_training:
    lr: 5.0e-4
  gen_training:
    lr: 5.0e-4

truthfulqa:
  split:
    steering_pool: 5
    train: 309
    test: 408

steering:
  vector_bank:
    num_vectors: 0
  enabled_variants: [mlp_mc]

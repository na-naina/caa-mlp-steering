# Gemma3-12B-IT with bn=8, lower LR (5e-5 vs 5e-4)
model:
  name: google/gemma-3-12b-it
  layer: 24
  family: gemma3
  dtype: bfloat16

mlp:
  architecture:
    bottleneck_dim: 8
  mc_training:
    lr: 5.0e-5
    batch_size: 1
    gradient_accumulation_steps: 8
  gen_training:
    lr: 5.0e-5
    batch_size: 1
    gradient_accumulation_steps: 8

steering:
  vector_bank:
    mode: individual
  enabled_variants: [mlp_mc]

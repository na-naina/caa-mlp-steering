# Pool=1: can we steer with a single example?
model:
  name: meta-llama/Llama-2-7b-chat-hf
  layer: 8
  family: llama2

mlp:
  architecture:
    bottleneck_dim: 8
  mc_training:
    lr: 5.0e-4
  gen_training:
    lr: 5.0e-4

truthfulqa:
  split:
    steering_pool: 1
    train: 309
    test: 0

steering:
  vector_bank:
    mode: individual
  enabled_variants: [mlp_mc]

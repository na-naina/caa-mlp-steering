run:
  id: null
  seed: 42

paths:
  output_root: data/outputs
  cache_root: cache
  hf_cache: cache/transformers

model:
  name: null  # Specify in model config
  layer: null  # Specify in model config
  family: null  # Model family for output organization (gemma3, qwen, etc.)
  dtype: bfloat16
  device_map: auto
  revision: null
  # max_memory: null  # Optional: constrain GPU memory allocation

# Stage-specific settings
# Each stage has different resource requirements:
#   extract:  Inference only, lower memory
#   train:    Needs gradients, highest memory
#   generate: Inference only
#   score:    Separate judge model

steering:
  max_length: 512
  scales: [1.0]
  use_mlp: true
  normalize_vector: false  # Keep original magnitude for proper steering effect
  # enabled_variants: [baseline, steered, mlp_gen]  # Optional filter

  # Extraction batch size (inference only - can be larger)
  extract_batch_size: 8

  # Options for numerical stability
  safe_attention: false  # Disable flash attention for stability
  autocast_dtype: null   # null, float16, or bfloat16

  vector_bank:
    num_vectors: 12
    min_samples: 30
    max_samples: 50

mlp:
  architecture:
    hidden_multiplier: 2.0
    dropout: 0.1

  # MC training (needs backward pass through model)
  mc_training:
    epochs: 2
    steps_per_epoch: 50
    batch_size: 8  # Reduce if OOM during training
    margin: 1.0
    lr: 1.0e-4
    weight_decay: 0.0
    grad_clip: 1.0
    mse_reg: 1.0e-2

  # Generation training
  gen_training:
    epochs: 2
    steps_per_epoch: 40
    batch_size: 4  # Reduce if OOM during training
    lr: 1.0e-4
    weight_decay: 0.0
    grad_clip: 1.0
    mse_reg: 1.0e-2

truthfulqa:
  dataset_name: truthful_qa
  dataset_config: generation
  cache_dir: cache/datasets
  split:
    steering_pool: 100
    train: 309
    test: 408

evaluation:
  # Generation parameters
  preset: qa  # TruthfulQA preset: 'qa', 'help', 'null', 'chat'
  max_new_tokens: 64
  temperature: 0.3
  top_p: 0.9
  top_k: 50
  stop_sequences: ["\n\n", "\nQuestion:"]

  # Truthfulness judge (runs in score stage)
  judge:
    mode: zero_shot
    model: google/gemma-3-12b-it
    max_new_tokens: 128
    dtype: bfloat16
    device_map: auto  # Will use available GPU in score stage

  # Informativeness judge
  informativeness:
    enabled: true
    mode: zero_shot
    model: google/gemma-3-12b-it  # Shares with truth judge
    max_new_tokens: 128
    dtype: bfloat16
    device_map: auto

  # Semantic similarity (lightweight, CPU-friendly)
  semantic:
    enabled: true
    model: sentence-transformers/all-MiniLM-L6-v2
    similarity_threshold: 0.6

  # BLEURT (optional)
  bleurt:
    enabled: false
    checkpoint: bleurt-base-128
    cache_dir: cache/bleurt

# SLURM defaults (can be overridden per model)
# These are for the TRAIN stage which needs most resources
slurm:
  partition: gpu
  gpus: 1
  mem_gb: 40
  time: "06:00:00"
